name: Build and Release

on:
  push:
    tags:
      - "v*"          # e.g. v1.0.0 triggers a build + GitHub release
  workflow_dispatch:   # manual run: builds artifacts only, no release

permissions:
  contents: write      # needed to create the release

env:
  PROJECT: kh-days-recoded-launcher.csproj
  APP_NAME: kh-days-recoded-launcher
  PY_SCRIPT: apply-patch.py 
  PY_NAME: Launcher-Patch

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest   # .NET can cross-publish for Windows from Linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            archive: zip
          - rid: linux-x64
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }} -r ${{ matrix.rid }}

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/${{ matrix.rid }}

      - name: Package (zip)
        if: matrix.archive == 'zip'
        run: |
          cd publish/${{ matrix.rid }}
          zip -r "../../${APP_NAME}-${{ matrix.rid }}.zip" .

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          # tar preserves the executable bit, which zip often loses
          tar -czf "${APP_NAME}-${{ matrix.rid }}.tar.gz" -C publish/${{ matrix.rid }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.rid }}
          path: ${{ env.APP_NAME }}-${{ matrix.rid }}.${{ matrix.archive }}
          if-no-files-found: error

  build-python:
    name: Build Python script (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}   # PyInstaller can't cross-compile, so build on each target OS
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-22.04    # older glibc = runs on more Linux distros
            rid: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build executable
        shell: bash
        run: pyinstaller --onefile --name "${{ env.PY_NAME }}" "${{ env.PY_SCRIPT }}"

      - name: Package (Windows)
        if: matrix.rid == 'win-x64'
        shell: bash
        run: cp "dist/${PY_NAME}.exe" "${PY_NAME}-${{ matrix.rid }}.exe"

      - name: Package (Linux)
        if: matrix.rid == 'linux-x64'
        run: tar -czf "${PY_NAME}-${{ matrix.rid }}.tar.gz" -C dist "${PY_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PY_NAME }}-${{ matrix.rid }}
          path: |
            ${{ env.PY_NAME }}-${{ matrix.rid }}.exe
            ${{ env.PY_NAME }}-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build, build-python]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true